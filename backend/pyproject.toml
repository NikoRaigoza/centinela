[project]
name = "centinela"
version = "0.1.0"
description = "Centinela: detección de phishing en correos de Gmail para usuarios en Colombia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "pyjwt>=2.10",
]

[project.scripts]
centinela = "centinela.adaptadores.entrada.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centinela"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracion: pruebas que necesitan PostgreSQL"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
